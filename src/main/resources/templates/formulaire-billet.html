<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: entete('Vendre un billet')}"></head>
<body>
<header th:replace="~{fragments :: entetePage}"></header>

<main class="contenu contenu-etroit">
    <div th:replace="~{fragments :: messages}"></div>

    <section class="entete-section">
        <div>
            <h1>Vendre un billet</h1>
            <p class="sous-titre">Le tarif et le statut sont contrôlés avant l'enregistrement.</p>
        </div>
        <a class="lien-secondaire" th:href="@{/billets}">Retour au registre</a>
    </section>

    <p class="message message-erreur" th:if="${erreurMetier}" th:text="${erreurMetier}">Erreur métier.</p>

    <form class="formulaire" method="post" novalidate th:object="${billet}" th:action="@{/billets/nouveau}">

        <div class="champ">
            <label for="acheteur">Nom de l'acheteur</label>
            <input type="text" id="acheteur" th:field="*{acheteur}" placeholder="Prénom et nom">
            <p class="erreur-champ" th:if="${#fields.hasErrors('acheteur')}" th:errors="*{acheteur}">Erreur</p>
        </div>

        <div class="champ">
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" th:field="*{telephone}" placeholder="06xxxxxxxx">
            <p class="erreur-champ" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}">Erreur</p>
        </div>

        <div class="champ">
            <label for="seance">Séance</label>
            <select id="seance" th:field="*{seance}">
                <option value="">— choisir une séance —</option>
                <option th:each="s : ${seancesDisponibles}"
                        th:value="${s.id}"
                        th:text="|${s.film.titre} — ${#temporals.format(s.dateHeure, 'dd/MM HH:mm')} — ${s.salle}|">
                    Séance
                </option>
            </select>
            <p class="erreur-champ" th:if="${#fields.hasErrors('seance')}" th:errors="*{seance}">Erreur</p>
        </div>

        <div class="champ">
            <label for="prix">Prix (MAD)</label>
            <input type="number" id="prix" th:field="*{prix}" step="0.01" min="10" max="500" placeholder="45.00">
            <p class="erreur-champ" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}">Erreur</p>
        </div>

        <div class="champ">
            <label for="dateAchat">Date d'achat</label>
            <input type="datetime-local" id="dateAchat" th:field="*{dateAchat}">
            <p class="erreur-champ" th:if="${#fields.hasErrors('dateAchat')}" th:errors="*{dateAchat}">Erreur</p>
        </div>

        <div class="champ">
            <label for="statut">Statut</label>
            <select id="statut" th:field="*{statut}">
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}">Valide</option>
            </select>
            <p class="erreur-champ" th:if="${#fields.hasErrors('statut')}" th:errors="*{statut}">Erreur</p>
        </div>

        <div class="actions-formulaire">
            <button type="submit" class="bouton bouton-principal">Émettre le billet</button>
            <a class="lien-secondaire" th:href="@{/billets}">Annuler</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
