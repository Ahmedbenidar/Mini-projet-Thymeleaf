<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: entete('Films')}"></head>
<body>
<header th:replace="~{fragments :: entetePage}"></header>

<main class="contenu">
    <div th:replace="~{fragments :: messages}"></div>

    <section class="entete-section">
        <div>
            <h1>Catalogue des films</h1>
            <p class="sous-titre">Filtrer par genre ou rechercher un titre, puis gérer l'affiche.</p>
        </div>
        <a class="bouton bouton-principal" th:href="@{/films/nouveau}">Ajouter un film</a>
    </section>

    <form class="barre-filtres" method="get" th:action="@{/films}">
        <label>
            Genre
            <select name="genre">
                <option value="" th:selected="${genreChoisi == null}">Tous les genres</option>
                <option th:each="g : ${genres}"
                        th:value="${g}"
                        th:text="${g.libelle}"
                        th:selected="${genreChoisi != null and genreChoisi.name() == g.name()}">Action</option>
            </select>
        </label>
        <label>
            Recherche
            <input type="search" name="recherche" th:value="${recherche}" placeholder="Titre du film">
        </label>
        <button type="submit" class="bouton">Filtrer</button>
        <a class="lien-secondaire" th:href="@{/films}">Réinitialiser</a>
    </form>

    <p class="vide" th:if="${#lists.isEmpty(films)}">Aucun film ne correspond à ces critères.</p>

    <table class="tableau" th:unless="${#lists.isEmpty(films)}">
        <thead>
        <tr>
            <th>Titre</th>
            <th>Genre</th>
            <th>Durée</th>
            <th>Réalisateur</th>
            <th>Année</th>
            <th>Séances</th>
            <th class="colonne-actions">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="film : ${films}">
            <td><strong th:text="${film.titre}">Titre</strong></td>
            <td><span class="etiquette" th:text="${film.genre.libelle}">Genre</span></td>
            <td th:text="${film.dureeFormatee}">2h00</td>
            <td th:text="${film.realisateur}">Réalisateur</td>
            <td th:text="${film.anneeSortie}">2024</td>
            <td th:text="${seancesParFilm[film.id]}">0</td>
            <td class="cellule-actions">
                <a class="bouton bouton-mini" th:href="@{/films/{id}/modifier(id=${film.id})}">Modifier</a>
                <form method="post"
                      th:action="@{/films/{id}/supprimer(id=${film.id})}"
                      th:attr="data-confirmation=|Retirer « ${film.titre} » du catalogue ?|"
                      class="formulaire-en-ligne">
                    <button type="submit" class="bouton bouton-mini bouton-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
