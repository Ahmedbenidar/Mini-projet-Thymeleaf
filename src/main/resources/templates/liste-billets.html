<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: entete('Billets')}"></head>
<body>
<header th:replace="~{fragments :: entetePage}"></header>

<main class="contenu">
    <div th:replace="~{fragments :: messages}"></div>

    <section class="entete-section">
        <div>
            <h1>Registre des billets</h1>
            <p class="sous-titre">Vente, annulation et contrôle à l'entrée de la salle.</p>
        </div>
        <a class="bouton bouton-principal" th:href="@{/billets/nouveau}">Vendre un billet</a>
    </section>

    <form class="barre-filtres" method="get" th:action="@{/billets}">
        <label>
            Statut
            <select name="statut">
                <option value="" th:selected="${statutChoisi == null}">Tous les statuts</option>
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}"
                        th:selected="${statutChoisi != null and statutChoisi.name() == s.name()}">Valide</option>
            </select>
        </label>
        <label>
            Acheteur
            <input type="search" name="recherche" th:value="${recherche}" placeholder="Nom ou téléphone">
        </label>
        <button type="submit" class="bouton">Filtrer</button>
        <a class="lien-secondaire" th:href="@{/billets}">Réinitialiser</a>
        <span class="recette-filtre" th:text="|Recette nette globale : ${#numbers.formatDecimal(recetteTotale, 1, 2)} MAD|">0 MAD</span>
    </form>

    <p class="vide" th:if="${#lists.isEmpty(billets)}">Aucun billet ne correspond à ces critères.</p>

    <table class="tableau" th:unless="${#lists.isEmpty(billets)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Acheteur</th>
            <th>Séance</th>
            <th>Prix</th>
            <th>Acheté le</th>
            <th>Statut</th>
            <th class="colonne-actions">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="billet : ${billets}">
            <td th:text="${billet.id}">1</td>
            <td>
                <strong th:text="${billet.acheteur}">Acheteur</strong>
                <span class="sous-texte" th:text="${billet.telephone}">0600000000</span>
            </td>
            <td>
                <span th:text="${billet.seance.film.titre}">Film</span>
                <span class="sous-texte"
                      th:text="|${#temporals.format(billet.seance.dateHeure, 'dd/MM/yyyy HH:mm')} · ${billet.seance.salle}|">Date</span>
            </td>
            <td th:text="|${#numbers.formatDecimal(billet.prix, 1, 2)} MAD|">0 MAD</td>
            <td th:text="${#temporals.format(billet.dateAchat, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
            <td>
                <span class="badge" th:classappend="${billet.classeStatut}" th:text="${billet.statut.libelle}">Valide</span>
            </td>
            <td class="cellule-actions">
                <form method="post" th:if="${billet.statut.name() == 'VALIDE'}"
                      th:action="@{/billets/{id}/valider(id=${billet.id})}" class="formulaire-en-ligne">
                    <button type="submit" class="bouton bouton-mini">Valider</button>
                </form>
                <form method="post" th:if="${billet.statut.name() != 'ANNULE'}"
                      th:action="@{/billets/{id}/annuler(id=${billet.id})}"
                      th:attr="data-confirmation=|Annuler le billet n° ${billet.id} de ${billet.acheteur} ?|"
                      class="formulaire-en-ligne">
                    <button type="submit" class="bouton bouton-mini bouton-danger">Annuler</button>
                </form>
                <form method="post"
                      th:action="@{/billets/{id}/supprimer(id=${billet.id})}"
                      th:attr="data-confirmation=|Supprimer définitivement le billet n° ${billet.id} ?|"
                      class="formulaire-en-ligne">
                    <button type="submit" class="bouton bouton-mini bouton-fantome">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
