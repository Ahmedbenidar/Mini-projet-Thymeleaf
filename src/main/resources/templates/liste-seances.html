<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: entete('Séances')}"></head>
<body>
<header th:replace="~{fragments :: entetePage}"></header>

<main class="contenu">
    <div th:replace="~{fragments :: messages}"></div>

    <section class="entete-section">
        <div>
            <h1>Planning des séances</h1>
            <p class="sous-titre">Filtrage par salle et par date, contrôle du remplissage en temps réel.</p>
        </div>
        <a class="bouton bouton-principal" th:href="@{/seances/nouvelle}">Planifier une séance</a>
    </section>

    <form class="barre-filtres" method="get" th:action="@{/seances}">
        <label>
            Salle
            <select name="salle">
                <option value="" th:selected="${salleChoisie == ''}">Toutes les salles</option>
                <option th:each="s : ${salles}" th:value="${s}" th:text="${s}"
                        th:selected="${salleChoisie == s}">SALLE</option>
            </select>
        </label>
        <label>
            Date
            <input type="date" name="jour" th:value="${jourChoisi}">
        </label>
        <label>
            Film
            <select name="filmId">
                <option value="" th:selected="${filmChoisi == null}">Tous les films</option>
                <option th:each="f : ${tousLesFilms}" th:value="${f.id}" th:text="${f.titre}"
                        th:selected="${filmChoisi != null and filmChoisi == f.id}">Film</option>
            </select>
        </label>
        <button type="submit" class="bouton">Filtrer</button>
        <a class="lien-secondaire" th:href="@{/seances}">Réinitialiser</a>
    </form>

    <p class="vide" th:if="${#lists.isEmpty(seances)}">Aucune séance ne correspond à ces critères.</p>

    <table class="tableau" th:unless="${#lists.isEmpty(seances)}">
        <thead>
        <tr>
            <th>Date et heure</th>
            <th>Film</th>
            <th>Salle</th>
            <th>Version</th>
            <th>Remplissage</th>
            <th>Places</th>
            <th class="colonne-actions">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="seance, iteration : ${seances}">
            <td th:text="${#temporals.format(seance.dateHeure, 'dd/MM/yyyy HH:mm')}">01/01/2025 20:00</td>
            <td>
                <strong th:text="${seance.film.titre}">Titre</strong>
                <span class="sous-texte" th:text="${seance.film.dureeFormatee}">2h00</span>
            </td>
            <td th:text="${seance.salle}">SALLE</td>
            <td th:text="${seance.version}">VF</td>
            <td>
                <div class="jauge">
                    <div class="jauge-barre" th:style="|width: ${remplissage[iteration.index]}%|"></div>
                </div>
                <span class="sous-texte" th:text="|${remplissage[iteration.index]} %|">0 %</span>
            </td>
            <td th:text="|${placesRestantes[iteration.index]} / ${seance.capacite}|">0 / 0</td>
            <td class="cellule-actions">
                <a class="bouton bouton-mini" th:href="@{/billets/nouveau(seanceId=${seance.id})}">Vendre</a>
                <a class="bouton bouton-mini" th:href="@{/seances/{id}/modifier(id=${seance.id})}">Modifier</a>
                <form method="post"
                      th:action="@{/seances/{id}/supprimer(id=${seance.id})}"
                      th:attr="data-confirmation=|Supprimer la séance du ${#temporals.format(seance.dateHeure, 'dd/MM/yyyy HH:mm')} ?|"
                      class="formulaire-en-ligne">
                    <button type="submit" class="bouton bouton-mini bouton-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
